[project]
name = "yt-rag"
version = "0.1.0"
description = "YouTube transcript ingestion + Supabase RAG"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.4.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "langchain-core>=0.3.0",  # tool_factory.py only
    "pydantic>=2.0.0",
    "yt-dlp>=2026.3.0",
    "mcp>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_rag"]
